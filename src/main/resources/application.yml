server:
  port: 9999

spring:
  # Redis 配置（短期记忆存储）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000ms

  ai:
    dashscope:
      api-key: sk-b40137d26a084faabf5b27206b99152a

    ollama:
      # 本地 Ollama 服务地址（默认端口 11434，无需修改）
      base-url: http://localhost:11434
      # 你本地创建的 DeepSeek 模型名（如 deepseek-r1，必须和 ollama list 中的一致）
      model: qwen3:8b
      # 可选：自定义模型生成参数（和 Modelfile 中的参数对应）
      options:
        temperature: 0.7        # 生成随机性
        num-ctx: 2048           # 上下文窗口大小
        top-p: 0.95             # 核采样参数
        think: false             # 关闭思考模式，避免干扰工具调用

    # RAG 相关配置
    rag:
      # 向量化模型（需要先在 Ollama 中拉取：ollama pull nomic-embed-text）
      embedding-model: nomic-embed-text
      # RAG 检索返回的文档片段数量
      top-k: 3
      # LLM 重排配置
      rerank-candidate-multiplier: 2    # 重排时召回的候选倍数（topK * 2 = 6 个候选）
      rerank-top-k: 30                  # 重排后最终保留的文档数，如果不希望重排，可以把这个值设大一点
    vectorstore:
      milvus:
        initialize-schema: true
        collection-name: hgh  # 向量数据集合名称，可自定义
#        embedding-dimension: 1536       # 向量维度，需与 embedding 模型匹配（nomic-embed-text 默认 768）
        # 自定义各个字段名称
        id-field-name: id           #主键字段，原来默认 doc_id
        content-field-name: content   #原来叫content
        embedding-field-name: vector      #原来叫embedding
        metadata-field-name: metadata  #原来叫metadata
        client:
          host: 127.0.0.1
          port: 19530

    # MCP 配置
    mcp:
      # MCP Server 配置：以 Streamable-HTTP 模式对外暴露工具
      server:
        name: listenevent-mcp-server
        version: 1.0.0
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
      # MCP Client 配置：连接外部 MCP Server
      client:
        enabled: true  # 设为 false 禁用 MCP（需先确保 MCP Server 环境就绪后再改为 true）
        # Stdio 方式连接本地 MCP Server
        stdio:
          servers-configuration: classpath:mcp-servers.json

logging:
  level:
    # 查看 MCP 工具调用日志
    org.springframework.ai.mcp: DEBUG
    # 查看 ChatClient 工具调用过程
    org.springframework.ai.chat.client: DEBUG

  # 文件上传大小限制（用于文档上传接口）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
