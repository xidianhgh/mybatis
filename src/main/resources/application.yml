server:
  port: 9999

spring:
  ai:
    dashscope:
      api-key: sk-b40137d26a084faabf5b27206b99152a

    ollama:
      # 本地 Ollama 服务地址（默认端口 11434，无需修改）
      base-url: http://localhost:11434
      # 你本地创建的 DeepSeek 模型名（如 deepseek-r1，必须和 ollama list 中的一致）
      model: mydeep
      # 可选：自定义模型生成参数（和 Modelfile 中的参数对应）
      options:
        temperature: 0.7        # 生成随机性
        num-ctx: 2048           # 上下文窗口大小
        top-p: 0.95             # 核采样参数

    # RAG 相关配置
    rag:
      # 向量化模型（需要先在 Ollama 中拉取：ollama pull nomic-embed-text）
      embedding-model: nomic-embed-text
      # RAG 检索返回的文档片段数量
      top-k: 3

    # MCP Client 配置：连接外部 MCP Server
    mcp:
      client:
        enabled: true  # 设为 false 禁用 MCP（需先确保 MCP Server 环境就绪后再改为 true）
        # Stdio 方式连接本地 MCP Server
        stdio:
          servers-configuration: classpath:mcp-servers.json

logging:
  level:
    # 查看 MCP 工具调用日志
    org.springframework.ai.mcp: DEBUG
    # 查看 ChatClient 工具调用过程
    org.springframework.ai.chat.client: DEBUG

  # 文件上传大小限制（用于文档上传接口）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
